# Skims the family inboxes and the city's trash notices twice a day. See scripts/skim.mjs for what it does
# and which secrets it needs. Run it by hand from the Actions tab → "Skim email & town" → Run workflow.
name: Skim email & town
on:
  schedule:
    - cron: "23 5 * * *"    # 12:23 AM Eastern (1:23 AM in summer)
    - cron: "23 17 * * *"   # 12:23 PM Eastern
  workflow_dispatch:
jobs:
  skim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund imapflow@1 mailparser@3
      - run: node scripts/skim.mjs
        env:
          GMAIL_1: ${{ secrets.GMAIL_1 }}
          GMAIL_2: ${{ secrets.GMAIL_2 }}
          GMAIL_3: ${{ secrets.GMAIL_3 }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_KEY: ${{ secrets.WORKER_KEY }}
